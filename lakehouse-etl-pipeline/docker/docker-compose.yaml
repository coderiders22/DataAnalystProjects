version: "3.8"

services:

  spark-jupyter:
    image: easewithdata/pyspark-jupyter-lab-old
    container_name: lakehouse-spark

    ports:
      - "8888:8888"
      - "4040:4040"

    volumes:
      - ../src_notebooks:/home/jovyan/work/src_notebooks
      - ../dataset:/home/jovyan/work/dataset
      - ../lib:/home/jovyan/work/lib
      - ../sql:/home/jovyan/work/sql

    restart: unless-stopped



  airflow:
    image: apache/airflow:2.8.1
    container_name: lakehouse-airflow

    depends_on:
      - spark-jupyter

    ports:
      - "8080:8080"

    volumes:
      - ../dags:/opt/airflow/dags
      - ../src_notebooks:/opt/airflow/src_notebooks
      - ../dataset:/opt/airflow/dataset

    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False

    command: >
      bash -c "
      airflow db init &&
      airflow users create
      --username admin
      --password admin
      --firstname admin
      --lastname admin
      --role Admin
      --email admin@example.com &&
      airflow webserver &
      airflow scheduler
      "

    restart: unless-stopped